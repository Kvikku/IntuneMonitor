name: Intune Export

on:
  schedule:
    - cron: '0 3 * * *'   # daily at 03:00 UTC
  workflow_dispatch:        # allow manual runs

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Decode certificate
        run: echo "${{ secrets.CERTIFICATE_BASE64 }}" | base64 -d > /tmp/m365exporter.pfx

      - name: Restore and build
        run: dotnet build src/IntuneMonitor -c Release --no-incremental

      - name: Run export
        env:
          INTUNEMONITOR_Authentication__TenantId: ${{ secrets.TENANT_ID }}
          INTUNEMONITOR_Authentication__ClientId: ${{ secrets.CLIENT_ID }}
          INTUNEMONITOR_Authentication__Method: Certificate
          INTUNEMONITOR_Authentication__CertificatePath: /tmp/m365exporter.pfx
          INTUNEMONITOR_Authentication__CertificatePassword: ${{ secrets.CERTIFICATE_PASSWORD }}
          INTUNEMONITOR_Backup__StorageType: Git
          INTUNEMONITOR_Backup__GitRemoteUrl: https://github.com/EnergiMidt/IntuneConfiguration.git
          INTUNEMONITOR_Backup__GitBranch: main
          INTUNEMONITOR_Backup__GitToken: ${{ secrets.GIT_TOKEN }}
          INTUNEMONITOR_Backup__GitUsername: M365Exporter
          INTUNEMONITOR_Backup__GitAuthorName: M365Exporter
          INTUNEMONITOR_Backup__GitAuthorEmail: m365exporter@noreply.github.com
          INTUNEMONITOR_Backup__AutoCommit: "true"
          INTUNEMONITOR_Backup__OpenHtmlExportReport: "false"
          INTUNEMONITOR_Monitor__OpenHtmlReport: "false"
        run: dotnet run --project src/IntuneMonitor -c Release -- export

      - name: Clean up certificate
        if: always()
        run: rm -f /tmp/m365exporter.pfx
